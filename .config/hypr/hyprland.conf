	################
	### MONITORS ###
	################

monitor=DP-3,2560x1440@200,auto,1,bitdepth,8

	###################
	### MY PROGRAMS ###
	###################

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = librewolf
$notes = joplin-desktop

	#################
	### AUTOSTART ###
	#################

exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QT_QPA_PLATFORMTHEME DBUS_SESSION_BUS_ADDRESS

exec-once = /usr/bin/gentoo-pipewire-launcher
exec-once = sh -c 'sleep 1 && /usr/libexec/xdg-desktop-portal-hyprland'
exec-once = sh -c 'sleep 2 && /usr/libexec/xdg-desktop-portal'

exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = mpvpaper -o "no-audio --loop-playlist --hwdec=auto" DP-3 /home/yigit/.config/hypr/mpvpaper/purple_eyes.mp4
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sh -c 'sleep 2 && hyprsession'

	#############################
	### ENVIRONMENT VARIABLES ###
	#############################

env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,breeze
env = XDG_MENU_PREFIX,plasma-

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = HYPRCURSOR_THEME,HyprCatppuccinMochaMauve
env = HYPRCURSOR_SIZE,35

	###################
	### PERMISSIONS ###
	###################


	#####################
	### LOOK AND FEEL ###
	#####################

general {
    gaps_in = 6
    gaps_out = 12
    
    border_size = 2

    col.active_border = rgba(61538Dff) rgba(b4befeff) 45deg
    col.inactive_border = rgba(313244aa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

#Decorations
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(cba6f744)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }


}

animations {
    enabled = true
    # Animation curves

    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    # animation = layers, 1, 2, md3_decel, slide
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, menu_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}
        #######################
        ### Workspace Rules ###
        #######################


        ######################
        ### Dwindle-Layout ###
        ######################

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}


        #####################
        ### Master-Layout ###
        #####################

master {
    new_status = master
}


        ############ 
        ### Misc ###
       	############

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


	#############
	### INPUT ###
	#############

input {
    kb_layout = tr
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

#Gestures
gesture = 3, horizontal, workspace

#Devices
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


	###################
	### KEYBINDINGS ###
	###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, K, togglesplit,

# Applications
bind = $mainMod, X, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, pkill rofi || rofi -show drun -show-icons
bind = $mainMod, Z, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, B, exec, $browser
bind = $mainMod, J, exec, $notes
bind = $mainMod, D, exec, $fileManager
bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy'

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Windows to a Workspace with Numpad
bind = $mainMod, KP_1, movetoworkspace, 1
bind = $mainMod, KP_2, movetoworkspace, 2
bind = $mainMod, KP_3, movetoworkspace, 3
bind = $mainMod, KP_4, movetoworkspace, 4
bind = $mainMod, KP_5, movetoworkspace, 5
bind = $mainMod, KP_6, movetoworkspace, 6
bind = $mainMod, KP_7, movetoworkspace, 7
bind = $mainMod, KP_8, movetoworkspace, 8
bind = $mainMod, KP_9, movetoworkspace, 9
bind = $mainMod, KP_0, movetoworkspace, 10

bind = $mainMod, KP_End, movetoworkspace, 1
bind = $mainMod, KP_Down, movetoworkspace, 2
bind = $mainMod, KP_Next, movetoworkspace, 3
bind = $mainMod, KP_Left, movetoworkspace, 4
bind = $mainMod, KP_Begin, movetoworkspace, 5
bind = $mainMod, KP_Right, movetoworkspace, 6
bind = $mainMod, KP_Home, movetoworkspace, 7
bind = $mainMod, KP_Up, movetoworkspace, 8
bind = $mainMod, KP_Prior, movetoworkspace, 9
bind = $mainMod, KP_Insert, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#Fix Audio and Dolphin Default Apps
bind = $mainMod, KP_Subtract, exec, ~/.local/bin/reload-audio.sh
bind = $mainMod, KP_Multiply, exec, kbuildsycoca6 --noincremental




	##############################
	### WINDOWS AND WORKSPACES ###
	##############################

windowrule = tile 1, match:class kitty

# Ignore maximize requests from all apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
